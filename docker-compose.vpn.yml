services:
  vpn:
    image: dperson/openvpn-client
    container_name: mediora-server-vpn
    cap_add:
      - net_admin
    security_opt:
      - label:disable
    networks:
      - default
    dns:
      - 1.1.1.1
      - 1.0.0.1
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=1
    volumes:
      - /dev/net:/dev/net:z
      - ./packages/vpn:/vpn
    entrypoint: ["/sbin/tini", "--", "/usr/bin/openvpn.sh"]
    command: '-p "51413" -p "51413;udp" -f ""'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ip route show default | grep -q tun || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    tty: true
  api:
    links:
      - vpn:transmission
    networks:
      - default
  transmission:
    network_mode: "service:vpn"
    depends_on:
      - vpn
  transmission-web:
    links:
      - vpn:transmission
    networks:
      - default
