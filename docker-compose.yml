volumes:
  web_build:
  api_build:
  api_node_modules:
  web_node_modules:
  db_data:
  redis_data:

networks:
  default:

services:
  api:
    container_name: bobarr-api
    env_file: .env
    user: "${PUID:-1000}:${PGID:-1000}"
    build:
      context: ./packages/api
    image: bobarr-api:latest
    command: yarn start:prod
    restart: unless-stopped
    volumes:
      - ./library/downloads:/downloads
      - ./library:/usr/library
      # Set these host paths when movies and TV shows live on separate disks.
      - ${MOVIES_LIBRARY_HOST_PATH:-./library}:/usr/drive4tb
      - ${TV_SHOWS_LIBRARY_HOST_PATH:-./library}:/usr/drive6tb
    ports:
      - 4000:4000

  web:
    container_name: bobarr-web
    env_file: .env
    build:
      context: ./packages/web
      args:
        WEB_UI_API_URL: ${WEB_UI_API_URL:-}
    image: bobarr-web:latest
    command: yarn start
    restart: unless-stopped
    ports:
      - 3000:3000

  postgres:
    container_name: bobarr-postgresql
    image: postgres:12-alpine
    env_file: .env
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    container_name: bobarr-redis
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    volumes:
      - redis_data:/data

  jackett:
    image: linuxserver/jackett
    container_name: bobarr-jacket
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./packages/jackett/config:/config
      - ./packages/jackett/downloads:/downloads
    ports:
      - 9117:9117

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: bobarr-flaresolverr
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped
    ports:
      - 8191:8191

  transmission:
    image: linuxserver/transmission
    container_name: bobarr-transmission
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./library/downloads:/downloads
      - ./packages/transmission/config:/config
      - ./packages/transmission/watch:/watch

  transmission-web:
    image: dperson/nginx
    container_name: bobarr-transmission-web
    depends_on:
      - transmission
    environment:
      - TZ=Europe/Paris
    ports:
      - "9091:80"
    command: -w "http://transmission:9091;/"
    restart: unless-stopped
