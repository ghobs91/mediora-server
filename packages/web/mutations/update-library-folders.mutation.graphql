mutation updateLibraryFolders(
  $moviesFolderName: String!
  $tvShowsFolderName: String!
  $moviesMountId: Int
  $tvShowsMountId: Int
) {
  libraryFolders: updateLibraryFolders(
    moviesFolderName: $moviesFolderName
    tvShowsFolderName: $tvShowsFolderName
    moviesMountId: $moviesMountId
    tvShowsMountId: $tvShowsMountId
  ) {
    mount {
      type
      name
      path
      state
      exists
      isDirectory
      canRead
      canWrite
      canTraverse
      canCreate
      mode
      ownerUid
      ownerGid
      message
      remedy
    }
    moviesMountId
    tvShowsMountId
    processUid
    processGid
    processRunsAsRoot
    folders {
      type
      name
      path
      state
      exists
      isDirectory
      canRead
      canWrite
      canTraverse
      canCreate
      mode
      ownerUid
      ownerGid
      message
      remedy
    }
  }
}
