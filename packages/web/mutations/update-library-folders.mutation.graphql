mutation updateLibraryFolders(
  $moviesFolderName: String!
  $tvShowsFolderName: String!
) {
  libraryFolders: updateLibraryFolders(
    moviesFolderName: $moviesFolderName
    tvShowsFolderName: $tvShowsFolderName
  ) {
    mount {
      type
      name
      path
      state
      exists
      isDirectory
      canRead
      canWrite
      canTraverse
      canCreate
      mode
      ownerUid
      ownerGid
      message
      remedy
    }
    processUid
    processGid
    processRunsAsRoot
    folders {
      type
      name
      path
      state
      exists
      isDirectory
      canRead
      canWrite
      canTraverse
      canCreate
      mode
      ownerUid
      ownerGid
      message
      remedy
    }
  }
}
