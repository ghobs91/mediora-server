services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: bobarr-tailscale
    cap_add:
      - net_admin
      - net_raw
    security_opt:
      - label:disable
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_ACCEPT_DNS=false
      - TS_EXIT_NODE=${TS_EXIT_NODE:-}
    entrypoint:
      - /bin/sh
      - /usr/local/bin/tailscale-entrypoint.sh
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./scripts/tailscale-entrypoint.sh:/usr/local/bin/tailscale-entrypoint.sh:ro
    networks:
      - default
    restart: unless-stopped

  transmission:
    network_mode: "service:tailscale"
    depends_on:
      - tailscale

  api:
    links:
      - tailscale:transmission
    networks:
      - default

  transmission-web:
    links:
      - tailscale:transmission
    networks:
      - default

volumes:
  tailscale_state:
